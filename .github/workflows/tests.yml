name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # task-definition matching reads old definitions from git history
      - uses: astral-sh/setup-uv@v5
      - name: Install (Python 3.11)
        run: |
          uv venv -p 3.11 .venv
          uv pip install -p .venv -e .
      - name: pytest (offline, fake clients; no secrets)
        run: .venv/bin/pytest -q
